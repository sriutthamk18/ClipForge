<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ClipForge — Free AI Clip Cutter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #101013;
    --surface: #18181D;
    --surface-2: #1F1F26;
    --line: #2A2A32;
    --text: #F3F3EF;
    --muted: #8B8B95;
    --pink: #FF3D71;
    --amber: #FFC24B;
    --cyan: #3DDBFF;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  header.hero {
    padding: 28px 20px 22px;
    border-bottom: 1px solid var(--line);
    position: relative;
    overflow: hidden;
  }
  .timeline-strip {
    display: flex;
    gap: 3px;
    height: 5px;
    margin-bottom: 22px;
  }
  .timeline-strip span {
    flex: 1;
    background: var(--line);
    border-radius: 2px;
  }
  .timeline-strip span.hot {
    background: linear-gradient(90deg, var(--pink), var(--amber));
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .brand h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 30px;
    letter-spacing: -0.5px;
    margin: 0;
    text-transform: uppercase;
  }
  .brand .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--bg);
    background: var(--amber);
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  header.hero p.sub {
    color: var(--muted);
    margin: 10px 0 0;
    font-size: 14.5px;
    max-width: 46ch;
    line-height: 1.5;
  }

  main { max-width: 640px; margin: 0 auto; padding: 22px 18px 80px; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 18px;
  }
  .panel-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  input[type=url], input[type=text], input[type=number], input[type=color] {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 13px 14px;
    color: var(--text);
    font-size: 15px;
    font-family: 'Inter', sans-serif;
  }
  input[type=color] { padding: 6px; height: 50px; }
  input:focus { outline: 2px solid var(--pink); outline-offset: 1px; }

  .field { margin-bottom: 16px; }
  .field-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text);
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 9px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--muted);
    font-size: 13.5px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    transition: border-color .15s, color .15s, background .15s;
  }
  .chip.active {
    border-color: var(--pink);
    color: var(--text);
    background: rgba(255,61,113,0.12);
  }
  .chip-row.toggles .chip {
    flex: 1;
    text-align: center;
  }
  .duration-row { display: flex; align-items: center; gap: 10px; }
  .duration-row select {
    flex: 1;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 11px;
    border-radius: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
  }

  button.primary {
    width: 100%;
    padding: 15px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg, var(--pink), #FF6B4B);
    color: #17070C;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    margin-top: 6px;
  }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary:active:not(:disabled) { transform: translateY(1px); }

  details.advanced { margin-top: 4px; }
  details.advanced summary {
    cursor: pointer;
    font-size: 12.5px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }
  details.advanced .field { margin-top: 14px; }

  .status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--muted);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--amber);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  .error-box {
    border: 1px solid #5A2331;
    background: rgba(255,61,113,0.08);
    color: #FFAFC2;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13.5px;
  }

  .results-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 26px 0 14px;
  }
  .results-head h2 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 18px; text-transform: uppercase; margin: 0;
  }
